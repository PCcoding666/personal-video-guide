[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "personal-video-guide"
version = "0.1.0"
description = "Let AI guide you through videos instead of summarizing them: a local toolkit a host agent calls to find new videos, fetch captions, and jump to the exact second."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["youtube", "captions", "mcp", "agent-skill", "video", "local-first"]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
]

[project.scripts]
video-guide = "video_guide.cli:main"

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]
dev = [
    "mypy>=1.10,<3",
    "pytest>=8,<10",
    "ruff>=0.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/video_guide"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
